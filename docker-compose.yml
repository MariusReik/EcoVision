services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecovision
      POSTGRES_USER: ecovision
      POSTGRES_PASSWORD: ecovision
    ports:
      - "5432:5432"
    volumes:
      - ecovision-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecovision -d ecovision"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ecovision-postgres-data:
