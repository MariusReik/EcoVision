spring:
  application:
    name: ecovision-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/ecovision
    username: ecovision
    password: ecovision

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080

ecovision:
  jwt:
    # No default on purpose - see JwtConfig.java. Must be a random value of at least
    # 32 bytes, e.g. `openssl rand -base64 32`. The app refuses to start without it.
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
